id: focus-sprint
name: Focus Sprint
concept: deep-work planning and execution coach for solo builders
target_users:
  - solo founders trying to ship consistently
  - indie hackers with too many parallel ideas
  - operators who need a strict execution routine
problem: Users collect many ideas but fail to turn them into a clear sprint plan, daily execution loop, and evidence-backed review ritual.
pages:
  - home landing page with positioning and proof
  - sprint planner for weekly scope selection
  - daily execution board for focused sessions
  - review page with retrospective evidence and momentum tracking
core_flows:
  - capture a weekly sprint goal and break it into daily execution slices
  - run a focused work session and log evidence for completion
  - review the sprint with metrics and qualitative notes
data_entities:
  - sprint
  - daily plan
  - focus session
  - review note
branding:
  tone: sharp and disciplined
  visual_direction: editorial productivity with warm contrast
  keywords:
    - calm
    - sharp
    - execution
  references:
    - Linear landing page clarity
    - Stripe docs information hierarchy
    - Notion editorial spacing
  anti_references:
    - generic SaaS gradient hero
    - crowded dashboard cards above the fold
  palette:
    primary: "#1F3A5F"
    accent: "#D97A2B"
    background: "#F6F1E8"
    surface: "#FFFDF9"
    text: "#111111"
  typography:
    korean: Pretendard
    english: Inter
    headings: Inter or Pretendard semibold by language
    body: Inter or Pretendard regular by language
    density: comfortable
  motion:
    style: restrained
    emphasis: section reveals only
  imagery:
    direction: editorial photography with warm contrast
    illustration: minimal line accents only
  layout_principles:
    - one dominant action per screen
    - spacious hero before dense utility
    - mobile expands vertically instead of shrinking everything
  component_rules:
    - buttons should feel decisive rather than playful
    - cards should separate sections, not create dashboard noise
    - forms should stay narrow and readable
monetization: freemium subscription with premium analytics and coaching templates
auth_need: required for saved plans and historical analytics
storage_need: moderate because users keep plan history and evidence snippets
deploy_preference: vercel
domain_preference: subdomain on one root domain
provider: openai
overrides:
  evidence_tooling: playwright when the actual app scaffold is created
success_metrics:
  - weekly sprint completion rate
  - number of completed focus sessions per user
  - returning users per 7-day window
